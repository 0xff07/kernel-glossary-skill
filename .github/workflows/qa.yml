name: QA self-test

on:
  push:
    paths:
      - 'tools/qa/**'
      - 'guidelines/**'
      - 'references/figures/**'
      - '.github/workflows/qa.yml'
  pull_request:
    paths:
      - 'tools/qa/**'
      - 'guidelines/**'
      - 'references/figures/**'
      - '.github/workflows/qa.yml'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate the QA rules and engine
        run: python3 tools/qa/kg.py selftest
